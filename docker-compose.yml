services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: wedding_user
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: wedding_planner
    ports: ["5432:5432"]
    volumes: [wedding_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wedding_user -d wedding_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wedding_pgdata:
